name: Render Profile Panels

on:
  schedule:
    # Five minutes is GitHub Actions' shortest supported interval; offset from :00 to reduce queue delays.
    - cron: "3-59/5 * * * *"
    # Refresh the complete historical contribution archive once a day.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - assets/panels/overview.svg
      - assets/panels/repositories.svg
      - assets/panels/trophies.svg
      - assets/panels/achievements.svg
      - assets/panels/recent-activity.svg
      - assets/panels/telemetry.svg
      - assets/panels/whoami.svg
      - assets/panels/contributions.svg
      - assets/panels/contributions-*.svg
      - assets/panels/toolkit.svg
      - assets/panels/footer-quote.svg
      - assets/panels/profile-metadata.json
      - README.md

permissions:
  contents: write

concurrency:
  group: profile-panels
  cancel-in-progress: true

jobs:
  render-panels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate custom SVG panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Karmanya03
          PROFILE_OUT_DIR: assets/panels
          REFRESH_CONTRIBUTION_HISTORY: ${{ github.event_name != 'schedule' || github.event.schedule == '17 3 * * *' }}
        run: |
          python scripts/generate_profile_panels.py

      - name: Commit rendered panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No panel changes detected"
            exit 0
          fi
          git add README.md assets/panels/overview.svg assets/panels/repositories.svg assets/panels/trophies.svg assets/panels/achievements.svg assets/panels/recent-activity.svg assets/panels/telemetry.svg assets/panels/whoami.svg assets/panels/contributions.svg assets/panels/contributions-*.svg assets/panels/toolkit.svg assets/panels/footer-quote.svg assets/panels/profile-metadata.json
          git commit -m "chore: refresh profile command-center panels"
          git push
