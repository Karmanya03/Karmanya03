<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1200" height="272" viewBox="0 0 1200 272" role="img" aria-label="Verified achievements">
  <defs>
    <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 79.5H80" stroke="#fff" stroke-opacity=".025"/>
      <circle cx="8" cy="12" r=".7" fill="#fff" opacity=".16"/>
      <circle cx="51" cy="40" r=".6" fill="#fff" opacity=".11"/>
      <circle cx="29" cy="66" r=".6" fill="#fff" opacity=".13"/>
    </pattern>
    <style>
      .canvas{fill:#09090a} .grain{fill:url(#grain)}
      .rule{stroke:#4b4540;stroke-width:1} .red{fill:#d12f37} .gold{fill:#d5ad52}
      .white{fill:#f4f0e9} .soft{fill:#aba59c}
      .micro{font:700 16px 'Segoe UI',Arial,sans-serif;letter-spacing:1px}
      .section{font:700 18px 'Segoe UI',Arial,sans-serif;letter-spacing:1px}
      .small{font:500 19px 'Segoe UI',Arial,sans-serif}
      .mono{font:600 16px Consolas,'Courier New',monospace}
      .serif{font:600 24px Georgia,'Times New Roman',serif}
      .num{font:500 45px Georgia,'Times New Roman',serif;font-variant-numeric:tabular-nums}
      .inkline{stroke-dasharray:28 10;animation:ink 8s linear infinite}
      .ambient-line{stroke-dasharray:46 1500;animation:rail 18s linear infinite}
      .footer-sweep-glow{stroke-dasharray:188 712;animation:footerSweep 8.5s linear infinite;filter:url(#footer-glow)}
      .footer-sweep{stroke-dasharray:188 712;animation:footerSweep 8.5s linear infinite}
      .card-edge{animation:edge 6s ease-in-out infinite}
      .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4.8s ease-in-out infinite}
      .warmth{animation:warmth 5.8s ease-in-out infinite}
      .heat-cell{transform-box:fill-box;transform-origin:center;animation:heat 3.4s ease-in-out infinite;animation-delay:var(--delay,0s)}
      .rank-meter{animation:rankGlow 4.2s ease-in-out infinite}
      .month{font:700 13px 'Segoe UI',Arial,sans-serif;letter-spacing:.5px}
      .weekday{font:700 12px 'Segoe UI',Arial,sans-serif}
      .yearnum{font:600 30px Georgia,'Times New Roman',serif;font-variant-numeric:tabular-nums}
      .badge-label{font:600 17px 'Segoe UI',Arial,sans-serif;letter-spacing:.2px}
      .badge-glyph{font:700 16px Consolas,'Courier New',monospace}
      @keyframes ink{to{stroke-dashoffset:-304}}
      @keyframes rail{to{stroke-dashoffset:-1546}}
      @keyframes footerSweep{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
      @keyframes edge{0%,100%{stroke-opacity:.48}50%{stroke-opacity:.92}}
      @keyframes pulse{0%,100%{opacity:.72;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
      @keyframes warmth{0%,100%{opacity:.2}50%{opacity:.55}}
      @keyframes heat{0%,100%{filter:brightness(.9);opacity:.8}50%{filter:brightness(1.7);opacity:1}}
      @keyframes rankGlow{0%,100%{opacity:.74}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
    </style>
  </defs>
  <rect width="1200" height="272" rx="5" class="canvas"/>
  <rect width="1200" height="272" rx="5" class="grain"/>
  <path d="M0 0H1200" stroke="#d12f37" stroke-width="5"/>
  <path d="M0 2H1200" stroke="#f4f0e9" stroke-opacity=".48" stroke-width="1" class="ambient-line"/>
  <rect x="30" y="25" width="42" height="27" rx="2" class="red"/>
  <text x="51" y="44" text-anchor="middle" class="micro white">02A</text>
  <text x="87" y="43" class="micro white">VERIFIED ACHIEVEMENTS</text>
  <path d="M30 62H1170" class="rule"/>
  <text x="56" y="91" class="micro gold">3 PUBLIC UNLOCKS</text><text x="1144" y="91" text-anchor="end" class="micro soft">LAST CHANGE · 17 Oct 2026 · 16:20 UTC</text>
  <a xlink:href="https://github.com/Karmanya03?achievement=pull-shark&amp;tab=achievements" target="_blank" rel="noopener noreferrer">
    <rect x="44" y="104" width="356" height="122" rx="6" fill="#101011" stroke="#68b7d3" stroke-opacity=".52" class="card-edge"/>
    <path d="M45 111H399" stroke="#68b7d3" stroke-width="3"/>
    <circle cx="88" cy="153" r="24" fill="#68b7d3" fill-opacity=".10" stroke="#68b7d3" stroke-opacity=".65"/>
    <circle cx="88" cy="153" r="30" fill="none" stroke="#68b7d3" stroke-opacity=".28" stroke-dasharray="2 7" class="inkline"/>
    <text x="88" y="161" text-anchor="middle" fill="#68b7d3" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="700">↗</text>
    <text x="126" y="158" class="serif white" font-size="22">Pull Shark</text>
    <path d="M64 188H380" class="rule"/>
    <text x="64" y="212" class="micro" fill="#68b7d3">EARNED · PUBLIC GITHUB PROFILE</text>
    <text x="380" y="212" text-anchor="end" class="micro soft">↗</text>
  </a>

  <a xlink:href="https://github.com/Karmanya03?achievement=starstruck&amp;tab=achievements" target="_blank" rel="noopener noreferrer">
    <rect x="422" y="104" width="356" height="122" rx="6" fill="#101011" stroke="#d5ad52" stroke-opacity=".52" class="card-edge"/>
    <path d="M423 111H777" stroke="#d5ad52" stroke-width="3"/>
    <circle cx="466" cy="153" r="24" fill="#d5ad52" fill-opacity=".10" stroke="#d5ad52" stroke-opacity=".65"/>
    <circle cx="466" cy="153" r="30" fill="none" stroke="#d5ad52" stroke-opacity=".28" stroke-dasharray="2 7" class="inkline"/>
    <text x="466" y="161" text-anchor="middle" fill="#d5ad52" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="700">✦</text>
    <text x="504" y="158" class="serif white" font-size="22">Starstruck</text>
    <path d="M442 188H758" class="rule"/>
    <text x="442" y="212" class="micro" fill="#d5ad52">EARNED · PUBLIC GITHUB PROFILE</text>
    <text x="758" y="212" text-anchor="end" class="micro soft">↗</text>
  </a>

  <a xlink:href="https://github.com/Karmanya03?achievement=yolo&amp;tab=achievements" target="_blank" rel="noopener noreferrer">
    <rect x="800" y="104" width="356" height="122" rx="6" fill="#101011" stroke="#e2464d" stroke-opacity=".52" class="card-edge"/>
    <path d="M801 111H1155" stroke="#e2464d" stroke-width="3"/>
    <circle cx="844" cy="153" r="24" fill="#e2464d" fill-opacity=".10" stroke="#e2464d" stroke-opacity=".65"/>
    <circle cx="844" cy="153" r="30" fill="none" stroke="#e2464d" stroke-opacity=".28" stroke-dasharray="2 7" class="inkline"/>
    <text x="844" y="161" text-anchor="middle" fill="#e2464d" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="700">!</text>
    <text x="882" y="158" class="serif white" font-size="22">YOLO</text>
    <path d="M820 188H1136" class="rule"/>
    <text x="820" y="212" class="micro" fill="#e2464d">EARNED · PUBLIC GITHUB PROFILE</text>
    <text x="1136" y="212" text-anchor="end" class="micro soft">↗</text>
  </a>
<text x="56" y="252" class="micro soft">BADGES LINK TO THEIR GITHUB ACHIEVEMENT PAGE</text>
</svg>
