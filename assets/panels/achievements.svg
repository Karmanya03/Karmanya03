    <stop offset=".56" stop-color="#d5ad52" stop-opacity=".92"/>
    <stop offset=".66" stop-color="#d5ad52" stop-opacity=".12"/>
    <stop offset="1" stop-color="#d5ad52" stop-opacity="0"/>
  </linearGradient>
</defs>
<g clip-path="url(#achievement-sheen-1-clip)" opacity=".26">
  <path d="M200 326h54l658 -658h-54Z" fill="url(#achievement-sheen-1-light)">
    <animateTransform attributeName="transform" type="translate" values="-370.40000000000003,-159.8;370.40000000000003,159.8" dur="9.16s" begin="0.27s" repeatCount="indefinite"/>
  </path>
</g>
    <path d="M423 111H777" stroke="#d5ad52" stroke-width="3"/>
    <circle cx="466" cy="153" r="24" fill="#d5ad52" fill-opacity=".10" stroke="#d5ad52" stroke-opacity=".65" class="achievement-bloom"/>
    <circle cx="466" cy="153" r="30" fill="none" stroke="#d5ad52" stroke-opacity=".28" stroke-dasharray="2 7" class="inkline"/>
    <text x="466" y="161" text-anchor="middle" fill="#d5ad52" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="700">✦</text>
    <text x="504" y="158" class="serif white" font-size="22">Starstruck</text>
    <path d="M442 188H758" class="rule"/>
    <text x="442" y="212" class="micro" fill="#d5ad52">EARNED · PUBLIC GITHUB PROFILE</text>
    <text x="758" y="212" text-anchor="end" class="micro soft">↗</text>
  </a>

  <a xlink:href="https://github.com/Karmanya03?achievement=yolo&amp;tab=achievements" target="_blank" rel="noopener noreferrer">
