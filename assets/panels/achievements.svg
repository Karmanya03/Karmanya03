    <circle cx="844" cy="153" r="24" fill="#e2464d" fill-opacity=".10" stroke="#e2464d" stroke-opacity=".65" class="achievement-bloom"/>
    <circle cx="844" cy="153" r="30" fill="none" stroke="#e2464d" stroke-opacity=".28" stroke-dasharray="2 7" class="inkline"/>
