  <text x="887" y="170" class="num white">715</text>
  <path d="M887 184H1123" stroke="#d5ad52" stroke-width="2"/>

  <text x="47" y="224" class="micro gold">LANGUAGE MIX</text>

  <text x="47" y="258" class="small white">Rust</text>
  <text x="372" y="258" text-anchor="end" class="mono gold">88.1%</text>
  <rect x="47" y="269" width="278" height="5" rx="2.5" fill="#312d29"/>
  <rect x="47" y="269" width="244" height="5" rx="2.5" fill="#d12f37" class="warmth"/>

  <text x="421" y="258" class="small white">Python</text>
  <text x="746" y="258" text-anchor="end" class="mono gold">3.3%</text>
  <rect x="421" y="269" width="278" height="5" rx="2.5" fill="#312d29"/>
  <rect x="421" y="269" width="9" height="5" rx="2.5" fill="#d5ad52" class="warmth"/>

  <text x="795" y="258" class="small white">JavaScript</text>
  <text x="1120" y="258" text-anchor="end" class="mono gold">2.9%</text>
  <rect x="795" y="269" width="278" height="5" rx="2.5" fill="#312d29"/>
  <rect x="795" y="269" width="8" height="5" rx="2.5" fill="#f4f0e9" class="warmth"/>

  <text x="47" y="312" class="small white">HTML</text>
  <text x="372" y="312" text-anchor="end" class="mono gold">2.7%</text>
  <rect x="47" y="323" width="278" height="5" rx="2.5" fill="#312d29"/>
  <rect x="47" y="323" width="7" height="5" rx="2.5" fill="#8c3336" class="warmth"/>

  <text x="421" y="312" class="small white">CSS</text>
  <text x="746" y="312" text-anchor="end" class="mono gold">1.9%</text>
  <rect x="421" y="323" width="278" height="5" rx="2.5" fill="#312d29"/>
  <rect x="421" y="323" width="5" height="5" rx="2.5" fill="#a39b8d" class="warmth"/>

  <text x="795" y="312" class="small white">Shell</text>
  <text x="1120" y="312" text-anchor="end" class="mono gold">0.5%</text>
  <rect x="795" y="323" width="278" height="5" rx="2.5" fill="#312d29"/>
  <rect x="795" y="323" width="1" height="5" rx="2.5" fill="#78736c" class="warmth"/>
<path d="M47 376H1152" class="rule"/><text x="47" y="403" class="micro gold">3</text><text x="47" y="421" class="micro soft">FORKS RECEIVED</text><text x="232" y="403" class="micro gold">30</text><text x="232" y="421" class="micro soft">FOLLOWING</text><text x="417" y="403" class="micro gold">10</text><text x="417" y="421" class="micro soft">PULL REQUESTS</text><text x="602" y="403" class="micro gold">0</text><text x="602" y="421" class="micro soft">ISSUES</text><text x="787" y="403" class="micro gold">13</text><text x="787" y="421" class="micro soft">LANGUAGES</text><text x="972" y="403" class="micro gold">5</text><text x="972" y="421" class="micro soft">ACTIVE REPOS · 90D</text>
  <path d="M47 456H1152" stroke="#d5ad52" stroke-width="1"/>
  <text x="47" y="482" class="micro soft">AS OF 17 OCT 2026 · 16:20 UTC</text>
  <path d="M869 479H1134" stroke="#d12f37" stroke-width="2" class="inkline"/>

</svg>
