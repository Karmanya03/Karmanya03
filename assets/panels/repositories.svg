  <a xlink:href="https://github.com/Karmanya03/Karmanya03" target="_blank" rel="noopener noreferrer">
  <text x="99" y="575" class="serif white">Karmanya03</text>
  </a>
  <text x="63" y="608" class="small soft"></text>
  <path d="M63 647H571" class="rule"/>
  <text x="63" y="676" class="micro gold">PYTHON</text>
  <text x="571" y="676" text-anchor="end" class="micro white">✳ 0   ⑂ 0</text>
