  <text x="63" y="403" class="small soft"><tspan x="63" dy="0">Ferret-rs 🦡 - A blazingly fast file finder and organizer</tspan><tspan x="63" dy="22">for Linux/Unix systems</tspan></text>
  <path d="M63 442H571" class="rule"/>
  <text x="63" y="471" class="micro gold">RUST</text>
  <text x="571" y="471" text-anchor="end" class="micro white">✳ 4   ⑂ 0</text>
  <text x="571" y="495" text-anchor="end" class="micro soft">PUSHED 31 JAN</text>

