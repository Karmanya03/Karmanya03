  <path d="M607 546H1147V715H607Z" fill="#101011" stroke="#3b3630" stroke-width="1" class="card-edge"/>
  <path d="M607 546V532H681L693 546" fill="#151313" stroke="#8f312f" stroke-width="1.2"/>
  <text x="622" y="574" class="micro red">06</text>
  <a xlink:href="https://github.com/Karmanya03/Grym" target="_blank" rel="noopener noreferrer">
